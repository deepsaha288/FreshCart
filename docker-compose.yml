services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:7.0
    container_name: freshcart-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: freshcart123
      MONGO_INITDB_DATABASE: freshcartdb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - freshcart-network

  # 2. Redis Cache Container
  redis:
    image: redis:7-alpine
    container_name: freshcart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - freshcart-network

  # 3. Apache Kafka (KRaft Mode - No Zookeeper needed)
  kafka:
    image: apache/kafka:latest
    container_name: freshcart-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - freshcart-network

  # 4. Backend FastAPI App Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshcart-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://admin:freshcart123@mongo:27017/freshcartdb?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=freshcart-secret-key-change-this-in-production
    volumes:
      - ./backend/invoices:/app/invoices
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongo
      - redis
      - kafka
    networks:
      - freshcart-network

volumes:
  mongo-data:
  redis-data:
  kafka-data:

networks:
  freshcart-network:
    driver: bridge
