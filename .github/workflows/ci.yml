name: CI Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Secret Variables
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ERROR: DOCKERHUB_TOKEN secret is not set!"
            exit 1
          fi
          echo "All required secret variables are configured."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Backend Image Locally
      - name: Build Backend Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-backend:${{ github.sha }}

      - name: Run Trivy scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/freshcart-backend:latest'
          format: 'table'
          exit-code: '0' # Logs vulnerability report but does not fail pipeline. Change to '1' to fail on findings.
          severity: 'CRITICAL,HIGH'

      # Push Backend Image to Docker Hub
      - name: Push Backend to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-backend:${{ github.sha }}

      # Build Frontend Image Locally
      - name: Build Frontend Locally
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-frontend:${{ github.sha }}

      - name: Run Trivy scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/freshcart-frontend:latest'
          format: 'table'
          exit-code: '0' # Logs vulnerability report but does not fail pipeline. Change to '1' to fail on findings.
          severity: 'CRITICAL,HIGH'

      # Push Frontend Image to Docker Hub
      - name: Push Frontend to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/freshcart-frontend:${{ github.sha }}
